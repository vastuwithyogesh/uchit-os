name: Rollback contract gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rollback-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate rollback and recovery contract
        run: node .uchit/rollback-gate.mjs
