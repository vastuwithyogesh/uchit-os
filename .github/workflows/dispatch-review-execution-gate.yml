name: Dispatch review execution gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Codex dispatch and independent review execution contracts
        run: node .uchit/dispatch-review-execution-gate.mjs
