name: Reviewer dispatcher gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate reviewer and dispatcher contracts
        run: node .uchit/reviewer-dispatcher-gate.mjs
