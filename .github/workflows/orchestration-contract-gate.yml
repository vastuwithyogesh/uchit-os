name: Orchestration contract gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate ledger, Task Packet and READY selector contracts
        run: node .uchit/orchestration-contract-gate.mjs
