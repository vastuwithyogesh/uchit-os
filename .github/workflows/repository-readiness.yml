name: Repository readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate repository governance prerequisites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .uchit/repository-readiness.mjs
