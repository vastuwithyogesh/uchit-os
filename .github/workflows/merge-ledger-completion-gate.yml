name: Merge ledger completion gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-ledger-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate merge readiness, post-merge continuation and Ledger completion
        run: node .uchit/merge-ledger-completion-gate.mjs
